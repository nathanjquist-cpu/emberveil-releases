name: Publish tested Emberveil build

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-game.yml', 'tools/**', 'tests/**', 'requests/**']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Approved game version, for example 0.13.0'
        required: true
        type: string
      mode:
        description: 'Verify a staging upload or publish it to the launcher'
        required: true
        default: verify
        type: choice
        options: [verify, publish]

permissions:
  contents: read

concurrency:
  group: emberveil-releases
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check publishing rules and current launcher feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/publish.py --inspect-live

  publish:
    needs: checks
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && github.event.release.prerelease &&
      startsWith(github.event.release.tag_name, 'staging-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify package and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish.py --event
